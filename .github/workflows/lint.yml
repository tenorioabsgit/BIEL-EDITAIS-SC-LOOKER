name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lintr:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            any::styler
          needs: check

      - name: Lint
        run: lintr::lint_dir("R")
        shell: Rscript {0}

      - name: Style check
        run: |
          changed <- styler::style_dir("R", dry = "on")
          if (any(changed$changed)) {
            cat("Arquivos fora do style guide:\n")
            print(changed[changed$changed, "file"])
            quit(status = 1)
          }
        shell: Rscript {0}
